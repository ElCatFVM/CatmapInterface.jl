name: CI
on:
  push:
    branches:
      - main
    tags: ['*']
  pull_request:
    branches:
      - main
jobs:
  test:
    if: github.event.pull_request.draft == false
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }} - ${{ github.event_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        version:
          - 'lts'
          - '1'
        os:
          - ubuntu-latest
        arch:
          - x64
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      - uses: actions/cache@v5
        env:
          cache-name: cache-artifacts
        with:
          path: ~/.julia/artifacts
          key: ${{ runner.os }}-test-${{ env.cache-name }}-${{ hashFiles('**/Project.toml') }}
          restore-keys: |
            ${{ runner.os }}-test-${{ env.cache-name }}-
            ${{ runner.os }}-test-
            ${{ runner.os }}-
      - name: Setup Python
        id: python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - uses: julia-actions/julia-buildpkg@v1
        env:
          PYTHON: ${{ steps.python.outputs.python-path }}
      - name: Checkout CatMAP
        uses: actions/checkout@v5
        with:
          repository: smaasz/catmap-1
          path: catmap-1
      - name: Quick Check
        env:
          CATMAP: ${{ github.workspace }}/catmap-1
        run: ls ${{ env.CATMAP }}
      - name: Install CatMAP dependencies
        run: |
          ${{ steps.python.outputs.python-path }} -m pip install --upgrade pip
          ${{ steps.python.outputs.python-path }} -m pip install -r requirements.txt
      - uses: julia-actions/julia-runtest@v1
        env:
          PYTHON: ${{ steps.python.outputs.python-path }}
          CATMAP: ${{ github.workspace }}/catmap-1
  docs:
    if: github.event.pull_request.draft == false
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - name: Install dependencies
        env:
          PYTHON: ""
        run: |
          julia --project=docs -e '
            using Pkg
            Pkg.develop(PackageSpec(path=pwd()))
            Pkg.instantiate()'
      - name: Build and deploy
        env:
          PYTHON: ""
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
        run: julia --project=docs docs/make.jl
